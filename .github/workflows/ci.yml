name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  # weekly, so that the badge tells main builds in the world of today, not
  # only on the day of its last push
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, coverage, cl-check]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # cl-check compares the branch with origin/main
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags since v8
      - run: make ${{ matrix.target }}

  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags since v8
      - run: make wheel-test PYTHONS=${{ matrix.python }}
