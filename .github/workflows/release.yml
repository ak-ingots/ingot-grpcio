name: release

# Publishes the package through trusted publishing: no token is stored, PyPI
# and TestPyPI trust this workflow in their GitHub environment.
#
# - A tag vX.Y.Z on main publishes the version of pyproject.toml, which must
#   be X.Y.Z, to TestPyPI, then to PyPI.
# - Run by hand (workflow_dispatch), it is a rehearsal: main as
#   X.Y.Z.devN, N the run number, to TestPyPI only.
#
# What is published is the build that `make wheel-test` tested; PyPI takes
# it once the workflow `index-test` of the meta repository has installed and
# tested it as TestPyPI gives it.
#
# What depends on the package is checked too, by the reusable workflow of the
# meta repository (ADR 0008): neither call holds a release back. A red
# `dep-try` tells what the build breaks, before PyPI; a red `dep-behind` after
# a release tells what is to be moved and released.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tag is checked against origin/main
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags since v8
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, the version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - name: Version the rehearsal
        if: github.ref_type != 'tag'
        run: |
          release=$(uv version --short | sed 's/\.dev[0-9]*$//')
          uv version --frozen "$release.dev$GITHUB_RUN_NUMBER"
      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - run: make wheel-test
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ingot-grpcio
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # pinned by commit: this action holds the publishing identity
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-check:
    needs: [build, testpypi]
    uses: ak-ingots/ingots-libs/.github/workflows/index-test.yml@main
    with:
      package: ingot-grpcio
      version: ${{ needs.build.outputs.version }}

  pypi:
    needs: testpypi-check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ingot-grpcio
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # pinned by commit: this action holds the publishing identity
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  dep-try:
    needs: build
    uses: ak-ingots/ingots-libs/.github/workflows/dependents.yml@main
    with:
      package: ingot-grpcio
      target: dep-try

  dep-behind:
    needs: pypi
    uses: ak-ingots/ingots-libs/.github/workflows/dependents.yml@main
    with:
      package: ingot-grpcio
      target: dep-behind
