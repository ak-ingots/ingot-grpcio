# The floor of the echo, over docker-compose.yml of the example: the same
# service on grpcio alone, in the image of the application of the role,
# its grpcio, the code of the floor the stand's, STAND_DIR, mounted.
services:
  app:
    image: echo-app:perf
  raw:
    image: echo-app:perf
    pull_policy: never
    depends_on: [app]
    entrypoint: [python, -m]
    command: [raw, "50051"]
    volumes:
      - ${STAND_DIR:?the directory of the stand}/raw:/srv/raw:ro
    ports:
      - "127.0.0.1:${ECHO_TEST_ECHO_RAW_PORT:-50072}:50051"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("localhost", 50051), 1)
      interval: 2s
      timeout: 5s
      retries: 30
